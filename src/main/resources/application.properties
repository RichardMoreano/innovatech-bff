# ==========================================
# CONFIGURACIÓN GENERAL DEL PROYECTO
# ==========================================
spring.application.name=innovatech-bff
server.port=8080

# ==========================================
# CONFIGURACIÓN DE URLS (MICROSERVICIOS INTERNOS)
# ==========================================
PROYECTOS_SERVICE_URL=${PROYECTOS_URL}

# ==========================================
# SEGURIDAD CENTRALIZADA (JWT)
# ==========================================
security.jwt.secret=${JWT_SECRET}

# ==========================================
# RESILIENCIA Y TIMEOUTS (FEIGN / RESILIENCE4J)
# ==========================================
# Configuración global para los clientes Feign
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000

# Umbrales del Circuit Breaker (Resilience4j)
resilience4j.circuitbreaker.instances.projectService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.projectService.waitDurationInOpenState=5s